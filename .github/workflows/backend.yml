name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/**', '.nvmrc', '.github/workflows/backend.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'contracts/**', '.nvmrc', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:db
